<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/hanab-logo-short.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hanab</title>
    <script>
      try {
        var theme = localStorage.getItem('app-theme');
        if (theme !== 'light' && theme !== 'dark' && theme !== 'project') theme = 'project';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch (e) {
        document.documentElement.dataset.theme = 'project';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
